<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Курьер | Доставка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --accent-2: #3b82f6;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .header h1 {
      margin: 0;
      font-size: 17px;
    }
    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }
    .actions-top {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: var(--accent-2);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.btn-green { background: var(--accent); color: #052e16; }
    button.btn-warn { background: var(--warn); color: #1c1917; }
    button.btn-gray { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .tab.active {
      background: var(--accent-2);
      color: #fff;
      border-color: var(--accent-2);
    }

    .status-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error-box {
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid var(--danger);
      color: #fecaca;
    }

    .order-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .client {
      font-size: 16px;
      font-weight: 700;
    }
    .total {
      font-size: 16px;
      font-weight: 700;
      color: #4ade80;
      white-space: nowrap;
    }
    .line {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .line strong { color: var(--text); }
    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0 10px;
    }
    .badge {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--card-2);
      border: 1px solid var(--border);
    }
    .order-text {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    .comment-input {
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Заказы курьера</h1>
      <div class="meta" id="courierMeta">ID: ...</div>
    </div>
    <div class="actions-top">
      <button class="btn-gray" id="refreshBtn" onclick="loadOrders()">↻ Обновить</button>
      <button class="btn-gray" id="changeIdBtn" onclick="changeTestId()" style="display:none;">Сменить ID</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabActive" onclick="switchTab('active')">Активные</div>
    <div class="tab" id="tabDone" onclick="switchTab('done')">Доставленные</div>
  </div>

  <div id="statusBox" class="status-box">Загрузка...</div>
  <div id="ordersList"></div>

  <script>
    // ВСТАВЬ СЮДА СВОЙ АКТУАЛЬНЫЙ URL ВЕБ-ПРИЛОЖЕНИЯ APPS SCRIPT (.../exec)
    const API_URL = "https://script.google.com/macros/s/ВСТАВЬ_СЮДА_СВОЙ_ID/exec";

    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    let currentTab = "active";
    let ordersCache = [];
    let courierId = "";

    function getCourierId() {
      const tgUserId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
      if (tgUserId) {
        return String(tgUserId).trim();
      }
      document.getElementById("changeIdBtn").style.display = "inline-block";
      let saved = (localStorage.getItem("test_courier_id") || "").trim();
      if (!saved) {
        saved = (prompt("Введите числовой Telegram ID курьера:", "842535280") || "").trim();
        if (saved) localStorage.setItem("test_courier_id", saved);
      }
      return saved;
    }

    function changeTestId() {
      localStorage.removeItem("test_courier_id");
      courierId = getCourierId();
      loadOrders();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tabActive").classList.toggle("active", tab === "active");
      document.getElementById("tabDone").classList.toggle("active", tab === "done");
      renderOrders();
    }

    function setStatus(text, isError = false) {
      const box = document.getElementById("statusBox");
      if (!text) {
        box.style.display = "none";
        return;
      }
      box.style.display = "block";
      box.textContent = text;
      box.classList.toggle("error-box", isError);
    }

    async function apiRequest(paramsObj) {
      if (!API_URL || API_URL.includes("ВСТАВЬ_СЮДА_СВОЙ_ID")) {
        throw new Error("Не указан API_URL в courier.html");
      }
      const url = new URL(API_URL);
      Object.entries(paramsObj).forEach(([k, v]) => {
        if (v !== undefined && v !== null) url.searchParams.set(k, String(v));
      });

      const res = await fetch(url.toString(), { method: "GET" });
      if (!res.ok) {
        throw new Error("HTTP " + res.status + " при обращении к Apps Script");
      }
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error("Ответ не JSON (проверьте доступ 'Все' в Apps Script): " + text.slice(0, 160));
      }
      if (Array.isArray(data)) {
        throw new Error("Сервер вернул прайс вместо данных курьера. Создайте Новое развёртывание в Apps Script.");
      }
      if (!data || data.ok === false) {
        throw new Error((data && data.error) ? data.error : "Ошибка сервера без описания");
      }
      return data;
    }

    async function loadOrders() {
      courierId = getCourierId();
      document.getElementById("courierMeta").textContent = "ID: " + (courierId || "не задан");
      if (!courierId) {
        setStatus("⛔ Не указан Telegram ID курьера", true);
        return;
      }

      const btn = document.getElementById("refreshBtn");
      btn.disabled = true;
      setStatus("Загружаем заказы...");
      document.getElementById("ordersList").innerHTML = "";

      try {
        const data = await apiRequest({ action: "courier_orders", tg_id: courierId });
        document.getElementById("courierMeta").textContent =
          "Курьер: " + (data.courierName || "—") + " | ID: " + courierId;
        ordersCache = Array.isArray(data.orders) ? data.orders : [];
        setStatus("");
        renderOrders();
      } catch (err) {
        setStatus("⛔ " + (err && err.message ? err.message : String(err)), true);
      } finally {
        btn.disabled = false;
      }
    }

    async function updateOrder(rowIndex, payload) {
      setStatus("Сохраняем изменения в таблице...");
      try {
        await apiRequest({
          action: "update_order",
          tg_id: courierId,
          rowIndex: rowIndex,
          ...payload
        });
        await loadOrders();
      } catch (err) {
        setStatus("⛔ " + (err && err.message ? err.message : String(err)), true);
      }
    }

    function renderOrders() {
      const list = document.getElementById("ordersList");
      const filtered = ordersCache.filter(o => {
        const isDone = String(o.status || "").trim().toLowerCase() === "доставлен";
        return currentTab === "done" ? isDone : !isDone;
      });

      if (!filtered.length) {
        list.innerHTML = '<div class="status-box">' +
          (currentTab === "done" ? "Доставленных заказов пока нет." : "Активных заказов пока нет.") +
          '</div>';
        return;
      }

      list.innerHTML = filtered.map(o => {
        const commentId = "comment_" + o.rowIndex;
        const safeComment = String(o.comment || "").replace(/"/g, "&quot;");
        return `
          <div class="order-card">
            <div class="order-top">
              <div class="client">${escapeHtml(o.client || "Клиент")}</div>
              <div class="total">${Number(o.total || 0).toFixed(2)} смн</div>
            </div>
            <div class="line"><strong>Адрес:</strong> ${escapeHtml(o.address || "—")}</div>
            <div class="line"><strong>Время:</strong> ${escapeHtml(o.createdAt || "—")}</div>
            <div class="badges">
              <span class="badge">Статус: ${escapeHtml(o.status || "Назначен")}</span>
              <span class="badge">Наличные: ${escapeHtml(o.cashStatus || "Ожидает")}</span>
              ${o.deliveredAt ? `<span class="badge">Доставлен: ${escapeHtml(o.deliveredAt)}</span>` : ""}
            </div>
            ${o.orderText ? `<div class="order-text">${escapeHtml(o.orderText)}</div>` : ""}
            <input
              id="${commentId}"
              class="comment-input"
              type="text"
              placeholder="Комментарий к заказу..."
              value="${safeComment}"
            />
            <div class="card-actions">
              <button
                class="btn-warn"
                onclick="updateOrder(${o.rowIndex}, { status: 'В пути', comment: document.getElementById('${commentId}').value })"
              >
                Взял заказ / В пути
              </button>
              <button
                class="btn-green"
                onclick="updateOrder(${o.rowIndex}, { status: 'Доставлен', cashStatus: 'В наличии', comment: document.getElementById('${commentId}').value })"
              >
                Доставлен и наличные в наличии
              </button>
              <button
                class="btn-gray"
                onclick="updateOrder(${o.rowIndex}, { comment: document.getElementById('${commentId}').value })"
              >
                Сохранить комментарий
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    loadOrders();
  </script>
</body>
</html>
