<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Курьер | Доставка заказов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f4f5f7);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1c1c1e);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(128,128,128,0.16);
      --green: #2e7d32;
      --orange: #ef6c00;
      --red: #c62828;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 14px 12px 30px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .top-bar h1 { font-size: 20px; font-weight: 700; }
    .top-bar p { font-size: 13px; color: var(--hint); margin-top: 2px; }
    .refresh-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; text-align: center; padding: 10px; border-radius: 12px;
      background: var(--card); border: 1px solid var(--border);
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .tab.active { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }

    .card {
      background: var(--card); border-radius: 16px; padding: 14px;
      margin-bottom: 12px; border: 1px solid var(--border);
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 8px; }
    .st-new { background: rgba(36,129,204,0.12); color: var(--btn); }
    .st-way { background: rgba(239,108,0,0.14); color: var(--orange); }
    .st-done { background: rgba(46,125,50,0.14); color: var(--green); }
    .st-cancel { background: rgba(198,40,40,0.14); color: var(--red); }

    .order-time { font-size: 12px; color: var(--hint); }
    .client-name { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .address { font-size: 14px; margin-bottom: 10px; line-height: 1.35; }

    .items-box {
      background: var(--bg); border-radius: 10px; padding: 10px;
      font-size: 13px; line-height: 1.45; white-space: pre-wrap; margin-bottom: 10px;
    }

    .money-row {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 8px; border-top: 1px solid var(--border); margin-bottom: 12px;
    }
    .total-sum { font-size: 17px; font-weight: 800; }
    .cash-tag { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 6px; }
    .cash-wait { background: rgba(239,108,0,0.12); color: var(--orange); }
    .cash-ok { background: rgba(46,125,50,0.15); color: var(--green); }

    .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      width: 100%; padding: 12px; border-radius: 11px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-way { background: var(--orange); color: #fff; }
    .btn-done { background: var(--green); color: #fff; }
    .btn-cancel { background: transparent; border: 1px solid var(--red); color: var(--red); }

    .center-box { text-align: center; padding: 50px 16px; color: var(--hint); font-size: 15px; }
    .comment-note { font-size: 12px; color: var(--red); margin-top: 6px; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>
      <h1 id="courierTitle">Заказы курьера</h1>
      <p id="courierSub">Загрузка профиля...</p>
    </div>
    <button class="refresh-btn" onclick="loadOrders()">↻ Обновить</button>
  </div>

  <div class="tabs" id="tabsBar" style="display:none;">
    <div class="tab active" id="tabActive" onclick="switchTab('active')">Активные (0)</div>
    <div class="tab" id="tabDone" onclick="switchTab('done')">Завершённые (0)</div>
  </div>

  <div id="content">
    <div class="center-box">Проверка доступа и загрузка заказов...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxMPEopPhziMRSrS03x7a3tqGzvNa9zfkMGJaTAy4HWwCcAxpKBmwC-r4QE1qgC7WZuqA/exec";

    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentTab = "active";
    let orders = [];
    let tgId = "";

    function resolveUserId() {
      if (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
        return String(tg.initDataUnsafe.user.id);
      }
      const saved = localStorage.getItem("test_courier_id");
      if (saved) return saved;
      const entered = prompt("Тестовый режим: введите ваш Telegram ID курьера:");
      if (entered) localStorage.setItem("test_courier_id", entered.trim());
      return (entered || "").trim();
    }

    async function loadOrders() {
      tgId = resolveUserId();
      const content = document.getElementById("content");

      if (!tgId) {
        content.innerHTML = `<div class="center-box">Не удалось определить Telegram ID. Откройте приложение через Telegram.</div>`;
        return;
      }

      content.innerHTML = `<div class="center-box">Загрузка заказов...</div>`;

      try {
        const url = `${API_URL}?action=courier_orders&tg_id=${encodeURIComponent(tgId)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
          document.getElementById("courierSub").innerText = "ID: " + tgId;
          document.getElementById("tabsBar").style.display = "none";
          content.innerHTML = `<div class="center-box">⛔ ${data.error}</div>`;
          return;
        }

        document.getElementById("courierTitle").innerText = `Курьер: ${data.courierName}`;
        document.getElementById("courierSub").innerText = `ID: ${tgId} • Оплата: только наличные`;
        document.getElementById("tabsBar").style.display = "flex";

        orders = data.orders || [];
        renderOrders();
      } catch (e) {
        content.innerHTML = `<div class="center-box">Ошибка соединения. Проверьте интернет и попробуйте снова.</div>`;
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tabActive").classList.toggle("active", tab === "active");
      document.getElementById("tabDone").classList.toggle("active", tab === "done");
      renderOrders();
    }

    function renderOrders() {
      const activeList = orders.filter(o => o.status === "Назначен" || o.status === "В пути");
      const doneList = orders.filter(o => o.status === "Доставлен" || o.status === "Отменён");

      document.getElementById("tabActive").innerText = `Активные (${activeList.length})`;
      document.getElementById("tabDone").innerText = `Завершённые (${doneList.length})`;

      const list = currentTab === "active" ? activeList : doneList;
      const content = document.getElementById("content");

      if (list.length === 0) {
        content.innerHTML = `<div class="center-box">${currentTab === "active" ? "Активных заказов пока нет" : "Завершённых заказов пока нет"}</div>`;
        return;
      }

      content.innerHTML = "";
      list.forEach(o => {
        let badgeClass = "st-new";
        if (o.status === "В пути") badgeClass = "st-way";
        else if (o.status === "Доставлен") badgeClass = "st-done";
        else if (o.status === "Отменён") badgeClass = "st-cancel";

        const isCashOk = o.cashStatus === "В наличии";

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-head">
            <span class="badge ${badgeClass}">${o.status}</span>
            <span class="order-time">${o.createdAt}</span>
          </div>
          <div class="client-name">🏪 ${escapeHtml(o.client)}</div>
          <div class="address">📍 ${escapeHtml(o.address)}</div>
          <div class="items-box">${escapeHtml(o.orderText)}</div>
          <div class="money-row">
            <span class="total-sum">${o.total.toFixed(2)} смн</span>
            <span class="cash-tag ${isCashOk ? "cash-ok" : "cash-wait"}">
              💵 Наличные: ${escapeHtml(o.cashStatus)}
            </span>
          </div>
          ${o.deliveredAt ? `<div class="order-time" style="margin-bottom:6px;">✅ Доставлен: ${o.deliveredAt}</div>` : ""}
          ${o.comment ? `<div class="comment-note">Примечание: ${escapeHtml(o.comment)}</div>` : ""}
          ${currentTab === "active" ? `
            <div class="actions">
              ${o.status === "Назначен" ? `<button class="btn btn-way" onclick="updateStatus(${o.rowIndex}, 'В пути', '')">🚚 Взял заказ / В пути</button>` : ""}
              <button class="btn btn-done" onclick="completeOrder(${o.rowIndex}, ${o.total})">✅ Доставлен и наличные в наличии (${o.total.toFixed(2)} смн)</button>
              <button class="btn btn-cancel" onclick="cancelOrder(${o.rowIndex})">✕ Отмена / Проблема</button>
            </div>
          ` : ""}
        `;
        content.appendChild(card);
      });
    }

    async function updateStatus(rowIndex, status, cashStatus, comment) {
      try {
        let url = `${API_URL}?action=update_order&tg_id=${encodeURIComponent(tgId)}&rowIndex=${rowIndex}`;
        if (status) url += `&status=${encodeURIComponent(status)}`;
        if (cashStatus) url += `&cashStatus=${encodeURIComponent(cashStatus)}`;
        if (comment !== undefined) url += `&comment=${encodeURIComponent(comment)}`;

        const res = await fetch(url);
        const data = await res.json();
        if (!data.ok) {
          alert("Ошибка: " + data.error);
          return;
        }
        loadOrders();
      } catch (e) {
        alert("Не удалось обновить статус. Проверьте интернет.");
      }
    }

    function completeOrder(rowIndex, total) {
      const ok = confirm(`Подтвердите: товар передан клиенту, а наличные ${total.toFixed(2)} смн получены и в наличии?`);
      if (!ok) return;
      updateStatus(rowIndex, "Доставлен", "В наличии");
    }

    function cancelOrder(rowIndex) {
      const reason = prompt("Укажите причину отмены или проблему:");
      if (reason === null) return;
      updateStatus(rowIndex, "Отменён", "Ожидает", reason.trim() || "Без комментария");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    loadOrders();
  </script>
</body>
</html>
