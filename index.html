<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Каталог цен | Закупщик</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f5f6f8);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1a1a1a);
      --hint: var(--tg-theme-hint-color, #8c9199);
      --accent: #e52322;
      --green: #1fa849;
      --green-light: rgba(31, 168, 73, 0.12);
      --border: rgba(0, 0, 0, 0.06);
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding-bottom: 96px;
    }

    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--card);
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .badge-fresh {
      background: var(--green-light);
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      opacity: 0.5;
    }

    .search-box {
      width: 100%;
      padding: 10px 14px 10px 36px;
      border-radius: 12px;
      border: none;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .scroll-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .scroll-row::-webkit-scrollbar { display: none; }

    .date-chip {
      padding: 5px 11px;
      border-radius: 8px;
      background: var(--bg);
      color: var(--hint);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.15s;
    }
    .date-chip.active {
      background: var(--text);
      color: var(--card);
    }

    .cat-section {
      padding: 12px 14px 4px;
    }

    .cat-chip {
      padding: 8px 14px;
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: var(--shadow);
      border: 1px solid transparent;
      transition: 0.15s;
    }
    .cat-chip.active {
      background: var(--accent);
      color: #ffffff;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px 14px;
    }

    .p-card {
      background: var(--card);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .p-thumb {
      width: 100%;
      height: 84px;
      border-radius: 12px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 8px;
      position: relative;
    }

    .diff-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .diff-up { background: #ffebee; color: #d32f2f; }
    .diff-down { background: #e8f5e9; color: #2e7d32; }

    .p-cat-tag {
      font-size: 10px;
      color: var(--hint);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .p-name {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 35px;
      text-transform: capitalize;
    }

    .p-footer {
      margin-top: auto;
    }

    .p-price {
      font-size: 17px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    .p-price span {
      font-size: 12px;
      font-weight: 600;
      color: var(--hint);
    }

    .add-btn {
      width: 100%;
      height: 36px;
      border-radius: 10px;
      border: none;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: 0.15s;
    }
    .add-btn:active { transform: scale(0.97); }

    .qty-control {
      width: 100%;
      height: 36px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .qty-btn {
      width: 30px;
      height: 28px;
      border: none;
      background: transparent;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-val {
      font-size: 13px;
      font-weight: 700;
    }

    .archive-label {
      width: 100%;
      height: 36px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--hint);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-bar {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: var(--accent);
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 6px 20px rgba(229, 35, 34, 0.35);
      cursor: pointer;
      z-index: 100;
    }

    .loader {
      text-align: center;
      padding: 50px 20px;
      color: var(--hint);
      font-size: 14px;
      grid-column: span 2;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 200;
      align-items: flex-end;
    }
    .modal-content {
      background: var(--card);
      width: 100%;
      border-radius: 24px 24px 0 0;
      padding: 20px 16px 24px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .modal-title { font-size: 19px; font-weight: 800; }
    .close-btn {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--bg); border: none; font-size: 16px;
      color: var(--hint); cursor: pointer;
    }
    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      margin-top: 10px;
      outline: none;
    }
    .submit-btn {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      margin-top: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sticky-top">
    <div class="header-top">
      <div class="header-title">🛒 Закупка продуктов</div>
      <span class="badge-fresh" id="activeDateBadge">Загрузка...</span>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-box" id="searchInput" placeholder="Найти товар в каталоге...">
    </div>

    <div class="scroll-row" id="dateRow"></div>
  </div>

  <div class="cat-section">
    <div class="scroll-row" id="catRow"></div>
  </div>

  <div class="product-grid" id="productList">
    <div id="loader" class="loader">Загрузка каталога...</div>
  </div>

  <div class="cart-bar" id="cartBar" onclick="openModal()">
    <span id="cartCount">Корзина • 0</span>
    <span id="cartTotal">0.00 смн →</span>
  </div>

  <div class="modal" id="orderModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">Оформление заказа</span>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div id="orderItems"></div>
      <input type="text" id="clientName" class="input-field" placeholder="Магазин / ресторан и телефон">
      <input type="text" id="clientAddress" class="input-field" placeholder="Адрес и время доставки">
      <button class="submit-btn" onclick="sendOrder()">Отправить заказ поставщику</button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxMPEopPhziMRSrS03x7a3tqGzvNa9zfkMGJaTAy4HWwCcAxpKBmwC-r4QE1qgC7WZuqA/exec";
    const SUPPLIER_USERNAME = "hazratgulomov";

    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let allData = [];
    let currentFiltered = [];
    let dates = [];
    let selectedDate = "";
    let selectedCat = "Все";
    let cart = {};

    function normalizePrice(val) {
      if (typeof val === "number") return Number.isFinite(val) ? val : 0;
      const cleaned = String(val ?? "").replace(",", ".").replace(/[^\d.-]/g, "");
      const num = parseFloat(cleaned);
      return Number.isFinite(num) ? num : 0;
    }

    function normalizeRow(row) {
      const dateRaw = row.date ?? row["ДАТА"] ?? row["Дата"] ?? "";
      const categoryRaw = row.category ?? row["КАТЕГОРИЯ"] ?? row["Категория"] ?? "Продукты";
      const nameRaw = row.name ?? row["ТОВАР"] ?? row["Товар"] ?? "";
      const unitRaw = row.unit ?? row["ЕДИНИЦА"] ?? row["Единица"] ?? "kg";
      const priceRaw = row.price ?? row["ЦЕНА"] ?? row["Цена"] ?? 0;

      let dateStr = String(dateRaw).trim();
      if (dateStr.includes("T")) {
        const d = new Date(dateStr);
        if (!isNaN(d.getTime())) {
          const dd = String(d.getDate()).padStart(2, "0");
          const mm = String(d.getMonth() + 1).padStart(2, "0");
          const yyyy = d.getFullYear();
          dateStr = `${dd}.${mm}.${yyyy}`;
        }
      }

      return {
        date: dateStr,
        category: String(categoryRaw).trim(),
        name: String(nameRaw).trim(),
        unit: String(unitRaw).trim() || "kg",
        price: normalizePrice(priceRaw)
      };
    }

    function getProductEmoji(name, category) {
      const str = (name + " " + category).toLowerCase();
      if (str.includes("картоф")) return "🥔";
      if (str.includes("лук")) return "🧅";
      if (str.includes("морков")) return "🥕";
      if (str.includes("помид") || str.includes("томат")) return "🍅";
      if (str.includes("огур")) return "🥒";
      if (str.includes("капуст")) return "🥬";
      if (str.includes("перец")) return "🫑";
      if (str.includes("чеснок")) return "🧄";
      if (str.includes("яблок")) return "🍎";
      if (str.includes("банан")) return "🍌";
      if (str.includes("лимон") || str.includes("апельсин") || str.includes("мандарин")) return "🍊";
      if (str.includes("виноград")) return "🍇";
      if (str.includes("арбуз")) return "🍉";
      if (str.includes("дыня")) return "🍈";
      if (str.includes("зелень") || str.includes("укроп") || str.includes("кинз")) return "🌿";
      if (str.includes("мясо") || str.includes("говяд") || str.includes("баран")) return "🥩";
      if (str.includes("куриц") || str.includes("филе") || str.includes("окороч")) return "🍗";
      if (str.includes("рыб")) return "🐟";
      if (str.includes("яйц")) return "🥚";
      if (str.includes("молок") || str.includes("кефир")) return "🥛";
      if (str.includes("сыр")) return "🧀";
      if (str.includes("масло")) return "🧈";
      if (str.includes("рис") || str.includes("греч") || str.includes("круп")) return "🌾";
      if (str.includes("мука") || str.includes("хлеб") || str.includes("лепеш")) return "🥖";
      if (str.includes("сахар") || str.includes("соль")) return "🧂";
      if (str.includes("макарон") || str.includes("спагет")) return "🍝";
      if (str.includes("вода") || str.includes("сок") || str.includes("напит")) return "🧃";
      if (str.includes("овощ")) return "🥗";
      if (str.includes("фрукт")) return "🍏";
      return "📦";
    }

    function parseDateStr(dStr) {
      if (!dStr) return new Date(0);
      const parts = String(dStr).split(".");
      if (parts.length !== 3) return new Date(0);
      return new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
    }

    async function loadPrices() {
      try {
        const res = await fetch(API_URL);
        const raw = await res.json();
        const list = Array.isArray(raw) ? raw : (Array.isArray(raw?.data) ? raw.data : []);
        allData = list
          .map(normalizeRow)
          .filter(item => item.date && item.name);

        const uniqueDates = [...new Set(allData.map(item => item.date))];
        uniqueDates.sort((a, b) => parseDateStr(b) - parseDateStr(a));
        dates = uniqueDates;

        if (dates.length > 0) {
          selectedDate = dates[0];
        }

        renderDates();
        renderCategories();
        renderProducts();
      } catch (err) {
        document.getElementById("productList").innerHTML =
          `<div class="loader">Ошибка загрузки прайса. Проверьте соединение и доступ к API.</div>`;
      }
    }

    function renderDates() {
      const row = document.getElementById("dateRow");
      const badge = document.getElementById("activeDateBadge");
      row.innerHTML = "";

      dates.forEach((d, idx) => {
        const chip = document.createElement("div");
        chip.className = "date-chip" + (d === selectedDate ? " active" : "");
        chip.innerText = idx === 0 ? `Свежий • ${d}` : d;
        chip.onclick = () => {
          selectedDate = d;
          cart = {};
          updateCartBar();
          renderDates();
          renderCategories();
          renderProducts();
        };
        row.appendChild(chip);
      });

      badge.innerText = selectedDate ? `Прайс от ${selectedDate}` : "Нет данных";
    }

    function renderCategories() {
      const row = document.getElementById("catRow");
      row.innerHTML = "";
      const itemsOnDate = allData.filter(i => i.date === selectedDate);
      const cats = ["Все", ...new Set(itemsOnDate.map(i => i.category).filter(Boolean))];

      if (!cats.includes(selectedCat)) selectedCat = "Все";

      cats.forEach(c => {
        const chip = document.createElement("div");
        chip.className = "cat-chip" + (c === selectedCat ? " active" : "");
        chip.innerText = c;
        chip.onclick = () => {
          selectedCat = c;
          renderCategories();
          renderProducts();
        };
        row.appendChild(chip);
      });
    }

    function getPrevPrice(name, currentDate) {
      const idx = dates.indexOf(currentDate);
      if (idx === -1 || idx + 1 >= dates.length) return null;
      const prevDate = dates[idx + 1];
      const prevItem = allData.find(
        i => i.date === prevDate && i.name.toLowerCase() === name.toLowerCase()
      );
      return prevItem ? prevItem.price : null;
    }

    function renderProducts() {
      const list = document.getElementById("productList");
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      list.innerHTML = "";

      currentFiltered = allData.filter(item => {
        const matchDate = item.date === selectedDate;
        const matchCat = selectedCat === "Все" || item.category === selectedCat;
        const matchSearch = item.name.toLowerCase().includes(query);
        return matchDate && matchCat && matchSearch;
      });

      if (currentFiltered.length === 0) {
        list.innerHTML = `<div class="loader">По вашему запросу ничего не найдено</div>`;
        return;
      }

      const isLatestDate = selectedDate === dates[0];

      currentFiltered.forEach((item, index) => {
        const key = `${item.name.toLowerCase()}__${item.unit}`;
        const qty = cart[key] ? cart[key].qty : 0;
        const prevPrice = getPrevPrice(item.name, selectedDate);
        const emoji = getProductEmoji(item.name, item.category);

        let diffHtml = "";
        if (prevPrice !== null && prevPrice !== item.price) {
          const diff = +(item.price - prevPrice).toFixed(2);
          if (diff > 0) diffHtml = `<span class="diff-badge diff-up">▲ +${diff} смн</span>`;
          else if (diff < 0) diffHtml = `<span class="diff-badge diff-down">▼ ${diff} смн</span>`;
        }

        const card = document.createElement("div");
        card.className = "p-card";

        let actionHtml = `<div class="archive-label">Архивная цена</div>`;
        if (isLatestDate) {
          if (qty > 0) {
            actionHtml = `
              <div class="qty-control">
                <button class="qty-btn" onclick="changeQtyByIndex(${index}, -1)">−</button>
                <span class="qty-val">${qty} ${item.unit}</span>
                <button class="qty-btn" onclick="changeQtyByIndex(${index}, 1)">+</button>
              </div>
            `;
          } else {
            actionHtml = `
              <button class="add-btn" onclick="changeQtyByIndex(${index}, 1)">
                <span>+</span> В корзину
              </button>
            `;
          }
        }

        card.innerHTML = `
          <div>
            <div class="p-thumb">
              ${diffHtml}
              <span>${emoji}</span>
            </div>
            <div class="p-cat-tag">${item.category}</div>
            <div class="p-name">${item.name}</div>
          </div>
          <div class="p-footer">
            <div class="p-price">${item.price.toFixed(2)} <span>смн / ${item.unit}</span></div>
            ${actionHtml}
          </div>
        `;
        list.appendChild(card);
      });
    }

    function changeQtyByIndex(index, delta) {
      const item = currentFiltered[index];
      if (!item) return;

      const key = `${item.name.toLowerCase()}__${item.unit}`;

      if (!cart[key]) {
        cart[key] = { name: item.name, unit: item.unit, price: item.price, qty: 0 };
      }
      cart[key].qty += delta;

      if (cart[key].qty <= 0) {
        delete cart[key];
      }

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred("light");
      }

      updateCartBar();
      renderProducts();
    }

    function updateCartBar() {
      const items = Object.values(cart);
      const bar = document.getElementById("cartBar");
      if (items.length === 0) {
        bar.style.display = "none";
        return;
      }
      const total = items.reduce((sum, i) => sum + i.price * i.qty, 0);
      document.getElementById("cartCount").innerText = `Корзина • ${items.length} поз.`;
      document.getElementById("cartTotal").innerText = `${total.toFixed(2)} смн →`;
      bar.style.display = "flex";
    }

    function openModal() {
      const container = document.getElementById("orderItems");
      container.innerHTML = "";
      let total = 0;

      Object.values(cart).forEach(i => {
        const sum = i.price * i.qty;
        total += sum;
        container.innerHTML += `
          <div class="order-item">
            <div>
              <div style="font-weight:600; text-transform:capitalize;">${i.name}</div>
              <div style="font-size:12px; color:var(--hint);">${i.qty} ${i.unit} × ${i.price.toFixed(2)} смн</div>
            </div>
            <b>${sum.toFixed(2)} смн</b>
          </div>
        `;
      });

      container.innerHTML += `
        <div class="order-item" style="border:none; font-size:17px; margin-top:8px;">
          <b>Итого к оплате:</b>
          <b style="color:var(--accent);">${total.toFixed(2)} смн</b>
        </div>
      `;
      document.getElementById("orderModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("orderModal").style.display = "none";
    }

    function sendOrder() {
      const client = document.getElementById("clientName").value.trim() || "Не указано";
      const address = document.getElementById("clientAddress").value.trim() || "Не указано";

      let text = `🛒 НОВЫЙ ЗАКАЗ (Прайс от ${selectedDate}):\n\n`;
      let total = 0;
      Object.values(cart).forEach((i, idx) => {
        const sum = i.price * i.qty;
        total += sum;
        text += `${idx + 1}. ${i.name} — ${i.qty} ${i.unit} × ${i.price} = ${sum.toFixed(2)} смн\n`;
      });
      text += `\n💰 Итого: ${total.toFixed(2)} смн\n`;
      text += `🏪 Клиент: ${client}\n`;
      text += `📍 Адрес: ${address}`;

      const tempInput = document.createElement("textarea");
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand("copy");
      document.body.removeChild(tempInput);

      fetch(API_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          priceDate: selectedDate,
          client: client,
          address: address,
          total: total.toFixed(2),
          orderText: text
        })
      }).catch(() => {});

      alert("Заказ сохранён и скопирован в буфер обмена! Сейчас откроется чат с @" + SUPPLIER_USERNAME + " — вставьте сообщение, если оно не подставилось автоматически.");

      if (SUPPLIER_USERNAME && tg) {
        tg.openTelegramLink(`https://t.me/${SUPPLIER_USERNAME}`);
      } else if (SUPPLIER_USERNAME) {
        window.open(`https://t.me/${SUPPLIER_USERNAME}`, "_blank");
      }
      closeModal();
    }

    document.getElementById("searchInput").addEventListener("input", renderProducts);
    loadPrices();
  </script>
</body>
</html>
